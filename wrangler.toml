name = "touchcd-crowdfunding"
main = "dist/server/index.js"
compatibility_date = "2026-01-01"
keep_vars = true
preview_urls = false

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false

[build]
command = "npm run build"

[vars]
SHOW_DEMO_CAMPAIGNS = "0"
MAIL_PROVIDER = "cloudflare"
ADMIN_EMAIL = "cdman1106@gmail.com"
MAIL_FROM = "noreply@send.touchcd-crowdfunding.com"

[[d1_databases]]
binding = "DB"
database_name = "touchcd-reservations"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@send.touchcd-crowdfunding.com"]
